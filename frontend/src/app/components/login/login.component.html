<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>🔐 Iniciar Sesión</h4>
            </div>
            <div class="card-body">
                
                <form (ngSubmit)="login()">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" [(ngModel)]="usuario" name="usuario" placeholder="email@ejemplo.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" placeholder="TuContraseña" required>
                    </div>

                    <div *ngIf="error" class="alert alert-danger p-2 text-center">
                        Credenciales incorrectas
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>

            </div>
            <div class="card-footer text-muted text-center text-small">
                <small>Simulación de login</small>
            </div>
        </div>
    </div>
</div>
